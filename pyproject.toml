[project]
name = "ossentinel"
version = "3.0.0"
description = "AI co-maintainer platform for open-source teams"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app", "agents", "core", "routers"]

[tool.coverage.report]
fail_under = 80
show_missing = true
