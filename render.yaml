services:
  - type: web
    name: ossentinel
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./osssentinel.db
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
